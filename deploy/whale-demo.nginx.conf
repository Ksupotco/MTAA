# Whale Demo 公网站点（Cloudflare 黄云代理 → 本源站）。仅部署骨架，按实际环境调整。
# 放置：/etc/nginx/sites-available/whale-demo.conf 并 ln -s 到 sites-enabled，nginx -t && systemctl reload nginx。
server {
    listen 80;
    listen [::]:80;
    server_name tianchi.wangfanlab.com;

    # 若 Cloudflare 以 Full/Full(strict) 回源 443，请另行配置 ssl_certificate（证书由 CF Origin CA 或宿主管理），
    # 并将下面 listen 80 改为 listen 443 ssl；Flexible 模式则 CF→源站走 80，无需本端证书。

    client_max_body_size 128k;   # API 请求体上限 64KiB，留余量

    # 静态资源短缓存（升级后尽快失效）；应用本身返回 no-store，这里对 js/css 放宽到 10 分钟。
    location ~* \.(js|css)$ {
        proxy_pass http://127.0.0.1:18761;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 10m;
        add_header Cache-Control "public, max-age=600";
    }

    location / {
        proxy_pass http://127.0.0.1:18761;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;   # AI 端点最长 35s，留余量
    }
}
